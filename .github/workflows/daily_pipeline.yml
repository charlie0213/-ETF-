name: TW Active ETF & Foreign Flow Daily Pipeline

on:
  schedule:
    - cron: '45 5 * * 1-5'
    - cron: '*/15 7-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chip-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Chip Tracker Pipeline
        run: python scripts/main.py

      - name: Commit & Push Updated DB and JSON Snapshots
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || (git commit -m "chore(data): auto update chip tracker [skip ci]" && git push)
